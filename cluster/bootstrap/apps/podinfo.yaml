apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: podinfo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://stefanprodan.github.io/podinfo
    chart: podinfo
    targetRevision: 6.7.0
    helm:
      valuesObject:
        replicaCount: 3
        image:
          tag: no-existe
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            memory: 256Mi
        hpa:
          enabled: true
          minReplicas: 3
          maxReplicas: 6
          cpu: 60
        # Sin esto el simulacro 3 no se puede demostrar. Que el HPA suba de 3 a
        # 6 replicas no dice nada por si solo: lo que hay que probar es que la
        # latencia que ve el usuario se mantiene mientras sube. Y para eso hay
        # que scrapear a la propia aplicacion, no solo al cluster.
        serviceMonitor:
          enabled: true
          interval: 15s
          # Sin esta etiqueta el ServiceMonitor se crea pero Prometheus no lo
          # mira. El operador solo recoge los que casan con su selector, que
          # por defecto es release igual al nombre de la release del chart de
          # monitorizacion. Es un fallo silencioso tipico: el objeto existe,
          # kubectl lo lista, y sin embargo no se scrapea nada.
          additionalLabels:
            release: monitoring
        ingress:
          enabled: true
          className: traefik
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-dns
          hosts:
            - host: app.lab.yosefnaabid.com
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - hosts:
                - app.lab.yosefnaabid.com
              secretName: podinfo-tls
  destination:
    server: https://kubernetes.default.svc
    namespace: podinfo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
