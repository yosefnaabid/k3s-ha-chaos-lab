apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: podinfo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://stefanprodan.github.io/podinfo
    chart: podinfo
    targetRevision: 6.7.0
    helm:
      valuesObject:
        replicaCount: 3
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            memory: 256Mi
        hpa:
          enabled: true
          minReplicas: 3
          maxReplicas: 6
          cpu: 60
        ingress:
          enabled: true
          className: traefik
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-dns
          hosts:
            - host: app.lab.yosefnaabid.com
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - hosts:
                - app.lab.yosefnaabid.com
              secretName: podinfo-tls
  destination:
    server: https://kubernetes.default.svc
    namespace: podinfo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
