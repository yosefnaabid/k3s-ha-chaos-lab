apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://metallb.github.io/metallb
    chart: metallb
    targetRevision: 0.14.8
  destination:
    server: https://kubernetes.default.svc
    namespace: metallb-system
  # MetalLB convierte entre versiones de sus CRD con un webhook, y su propio
  # controlador le inyecta en caliente el certificado de ese webhook: 1500
  # caracteres de caBundle que en Git no estan ni pueden estar, porque los
  # genera el cluster al arrancar. ArgoCD comparaba lo que hay con lo que dice
  # el repositorio, veia esa diferencia y dejaba la aplicacion OutOfSync para
  # siempre aunque el despliegue fuese correcto.
  #
  # Es el caso de libro de ignoreDifferences: un campo que el cluster gestiona
  # legitimamente y del que Git no debe ser la fuente de la verdad.
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /spec/conversion/webhook/clientConfig/caBundle
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/yosefnaabid/k3s-ha-chaos-lab.git
    targetRevision: main
    path: cluster/apps/metallb
  destination:
    server: https://kubernetes.default.svc
    namespace: metallb-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
