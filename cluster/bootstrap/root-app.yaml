# App de apps: ArgoCD se instala una vez a mano y esta App hace el resto.
# kubectl apply -n argocd -f cluster/bootstrap/root-app.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/yosefnaabid/k3s-ha-chaos-lab.git
    targetRevision: main
    path: cluster/bootstrap/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
