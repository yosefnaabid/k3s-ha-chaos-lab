# Certificados reales de Let's Encrypt por reto DNS contra Cloudflare.
# El cluster no expone NADA a internet: el reto es un TXT en tu zona DNS.
#
# El token de Cloudflare es el UNICO secreto del proyecto y NUNCA toca Git.
# Se crea una vez, a mano, y queda documentado en docs/setup-secrets.md:
#   kubectl -n cert-manager create secret generic cloudflare-api-token \
#     --from-literal=api-token=TU_TOKEN
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-dns
spec:
  acme:
    email: yosefnaabid@gmail.com
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-dns-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
